<div *ngIf="form$ | async as form" class="container mx-auto p-4 max-w-2xl">
  <div class="bg-white rounded-lg shadow-md p-6">
    <h1 class="text-3xl font-bold mb-2">{{ form.title }}</h1>
    <p class="text-gray-600 mb-6">{{ form.description }}</p>

    <form [formGroup]="dynamicForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div *ngFor="let field of form.fields" class="flex flex-col">
        <label [for]="'field-' + field.id" class="mb-1 font-medium text-gray-700">
          {{ field.label }}<span *ngIf="field.isRequired" class="text-red-500">*</span>
        </label>
        
        <!-- Text & Email & Date -->
        <input *ngIf="['text', 'email', 'date'].includes(field.fieldType)"
               [type]="field.fieldType"
               [id]="'field-' + field.id"
               [formControlName]="field.id.toString()"
               [placeholder]="field.placeholder || ''"
               class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">

        <!-- Textarea -->
        <textarea *ngIf="field.fieldType === 'textarea'"
                  [id]="'field-' + field.id"
                  [formControlName]="field.id.toString()"
                  [placeholder]="field.placeholder || ''"
                  rows="4"
                  class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>

        <!-- Select -->
        <select *ngIf="field.fieldType === 'select'"
                [id]="'field-' + field.id"
                [formControlName]="field.id.toString()"
                class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="" disabled selected>Select an option</option>
          <option *ngFor="let opt of getOptions(field)" [value]="opt">{{ opt }}</option>
        </select>

        <!-- Radio -->
        <div *ngIf="field.fieldType === 'radio'" class="flex flex-col space-y-2">
            <label *ngFor="let opt of getOptions(field)" class="inline-flex items-center">
                <input type="radio" [formControlName]="field.id.toString()" [value]="opt" class="mr-2">
                {{ opt }}
            </label>
        </div>

        <!-- Checkbox -->
        <div *ngIf="field.fieldType === 'checkbox'">
            <ng-container *ngIf="getOptions(field).length > 0; else singleCheckbox">
                 <!-- Treating as radio for single-value storage simply for now -->
                 <label *ngFor="let opt of getOptions(field)" class="inline-flex items-center mr-4">
                    <input type="radio" [formControlName]="field.id.toString()" [value]="opt" class="mr-2">
                    {{ opt }}
                 </label>
            </ng-container>
            <ng-template #singleCheckbox>
                <div class="flex items-center">
                    <input type="checkbox" [id]="'field-' + field.id" [formControlName]="field.id.toString()" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded mr-2">
                    <label [for]="'field-' + field.id" class="text-sm text-gray-700">{{ field.label }}</label>
                </div>
            </ng-template>
        </div>

        <!-- Validation Error Message -->
         <div *ngIf="dynamicForm.get(field.id.toString())?.invalid && (dynamicForm.get(field.id.toString())?.touched || dynamicForm.get(field.id.toString())?.dirty)" class="text-red-500 text-sm mt-1">
             <span *ngIf="dynamicForm.get(field.id.toString())?.errors?.['required']">This field is required.</span>
             <span *ngIf="dynamicForm.get(field.id.toString())?.errors?.['email']">Invalid email address.</span>
         </div>
      </div>

      <button type="submit" [disabled]="dynamicForm.invalid" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 disabled:opacity-50 mt-6 shadow-md transition-colors">
        Submit Form
      </button>
    </form>
  </div>
</div>
<div *ngIf="!(form$ | async)" class="flex justify-center items-center h-64">
    <p class="text-gray-500">Loading form...</p>
</div>
