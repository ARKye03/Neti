<div class="flex flex-col gap-8 max-w-2xl mx-auto py-10">
    <div class="flex items-center gap-6">
        <div class="relative">
            <img src="emptyAvatar.webp" alt="Avatar"
                class="size-24 rounded-full border-4 border-white dark:border-[#2a3b4d] shadow-xl">
            <button
                class="absolute bottom-0 right-0 size-8 bg-primary text-white rounded-full flex items-center justify-center shadow-lg hover:bg-blue-600 transition-colors">
                <span class="material-symbols-outlined text-[18px]">edit</span>
            </button>
        </div>
        <div class="flex flex-col gap-1">
            <h1 class="text-3xl font-extrabold text-[#111418] dark:text-white">{{ authService.currentUser()?.username }}
            </h1>
            <p class="text-[#617589] dark:text-gray-400 font-medium">{{ authService.currentUser()?.email }}</p>
            <div class="flex gap-2 mt-2">
                <span class="px-2 py-0.5 rounded bg-primary/10 text-primary text-xs font-bold uppercase tracking-wider">
                    Member since Dec 2025
                </span>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div
            class="p-6 rounded-xl border border-[#dbe0e6] dark:border-[#2a3b4d] bg-white dark:bg-[#1a2632] flex flex-col gap-2">
            <span class="material-symbols-outlined text-primary text-[32px]">description</span>
            <div class="text-2xl font-bold dark:text-white">12</div>
            <div class="text-sm font-medium text-[#617589] dark:text-gray-400">Total Forms Created</div>
        </div>
        <div
            class="p-6 rounded-xl border border-[#dbe0e6] dark:border-[#2a3b4d] bg-white dark:bg-[#1a2632] flex flex-col gap-2">
            <span class="material-symbols-outlined text-green-500 text-[32px]">checklist</span>
            <div class="text-2xl font-bold dark:text-white">458</div>
            <div class="text-sm font-medium text-[#617589] dark:text-gray-400">Total Submissions</div>
        </div>
    </div>

    <div class="flex flex-col gap-4">
        <h2 class="text-xl font-bold dark:text-white px-1">Account Settings</h2>
        <div class="flex flex-col rounded-xl border border-[#dbe0e6] dark:border-[#2a3b4d] overflow-hidden">
            <button
                class="flex items-center justify-between p-4 bg-white dark:bg-[#1a2632] hover:bg-gray-50 dark:hover:bg-[#253341] transition-colors border-b border-[#dbe0e6] dark:border-[#2a3b4d]">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-[#617589]">person</span>
                    <span class="font-bold dark:text-white text-sm">Edit Profile</span>
                </div>
                <span class="material-symbols-outlined text-[#617589]">chevron_right</span>
            </button>
            <button
                class="flex items-center justify-between p-4 bg-white dark:bg-[#1a2632] hover:bg-gray-50 dark:hover:bg-[#253341] transition-colors border-b border-[#dbe0e6] dark:border-[#2a3b4d]">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-[#617589]">notifications</span>
                    <span class="font-bold dark:text-white text-sm">Notifications</span>
                </div>
                <span class="material-symbols-outlined text-[#617589]">chevron_right</span>
            </button>
            <button
                class="flex items-center justify-between p-4 bg-white dark:bg-[#1a2632] hover:bg-gray-50 dark:hover:bg-[#253341] transition-colors"
                (click)="logout()">
                <div class="flex items-center gap-3 text-red-500">
                    <span class="material-symbols-outlined">logout</span>
                    <span class="font-bold text-sm">Logout</span>
                </div>
            </button>
        </div>
    </div>
</div>
